<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220">
  <defs>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.82  0 0 0 0 0.86  0 0 0 0 0.9  0 0 0 0.55 0"/>
    </filter>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f5"/>
      <stop offset="1" stop-color="#d5d8dc"/>
    </linearGradient>
  </defs>
  <rect width="160" height="220" fill="url(#mist)"/>
  <rect width="160" height="220" filter="url(#frost)"/>
</svg>
